name: CI

on:
  push:
    branches: [ Upstream ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ Upstream ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: dotnet test Logzilla.sln -c Release --nologo --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # Publishes the app, then packages it into the installer. No third-party
      # tooling is installed: the installer is a project in this solution.
      - name: Publish and package
        run: .\build\build.ps1 -SkipTests
        shell: pwsh

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Logzilla-app
          path: artifacts/publish/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Logzilla-installer
          path: dist/Logzilla-Setup.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Logzilla-Setup.exe
          generate_release_notes: true
